[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptolab"
version = "0.1.0"
description = "CLI Encryption, Decryption, and Encoding Toolkit for Security Labs"
readme = "README.md"
authors = [{ name = "Praktikan Keamanan Informasi" }]
requires-python = ">=3.9"
dependencies = [
    "pycryptodome>=3.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
cryptolab = "cryptolab.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
